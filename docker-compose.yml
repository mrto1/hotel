# Lokale Entwicklung: nur die Datenbank. `docker compose up -d db`
# Komplett (App + Worker): `docker compose --profile full up --build`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    profiles: [full]
    build: .
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hotel_dev
    ports: ["3000:3000"]
    volumes: [uploads:/app/data/uploads]
    depends_on: [db]
  worker:
    profiles: [full]
    build: .
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hotel_dev
    command: ["node", "--import", "tsx", "src/jobs/worker.ts"]
    depends_on: [db]
volumes:
  pgdata:
  uploads:
